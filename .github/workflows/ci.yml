name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ENV: test
  SITE_URL: http://localhost:3000
  EDITOR_URL: http://localhost:3001
  PUBLIC_WEB_INTERNAL_BASE_URL: http://localhost:3000
  MEDIA_PUBLIC_BASE_URL: http://localhost:3000/media
  SCHEDULED_PUBLISH_RUNNER_SECRET: ci-scheduled-publish-runner-secret-32
  PUBLIC_CACHE_INVALIDATION_SECRET: ci-public-cache-invalidation-secret-32

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Domain tests
        run: pnpm test

      - name: Migration check
        run: pnpm db:check

      - name: Production build
        run: pnpm build
